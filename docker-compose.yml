# Docker Compose v2+ — 'version' field is deprecated and removed

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: chatbot-openwebui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://middleware:8001/v1
      - OPENAI_API_KEY=${API_KEY:-local-dev-api-key}
      - HF_TOKEN=${HF_TOKEN}
      - DEFAULT_MODELS=gemma4
      - WEBUI_AUTH=true
      - ENABLE_OAUTH_SIGNUP=false
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - middleware
    restart: always

  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: chatbot-middleware
    ports:
      - "8001:8001"
    volumes:
      - ./middleware:/app
      - ${OBSIDIAN_VAULT_PATH:-./obsidian_vault_placeholder}:/app/obsidian_vault:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Use http://host.docker.internal:11434 to make it FAST on your M5 Pro Max!
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Must match OPENAI_API_KEY on openwebui so the UI can call the middleware.
      - API_KEY=${API_KEY:-local-dev-api-key}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - HF_TOKEN=${HF_TOKEN}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - LOGFIRE_PROJECT_NAME=${LOGFIRE_PROJECT_NAME:-vibechatbot}
      - DOCLING_ALLOW_EXTERNAL_PLUGINS=true
    # depends_on:
    #   - ollama
    restart: always

  arangodb:
    image: arangodb:3.11
    container_name: chatbot-arangodb
    environment:
      - ARANGO_NO_AUTH=1 # Simplified for local dev
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
    restart: always

volumes:
  openwebui_data:
  ollama_data:
  arangodb_data:
